name: Stage
options:
  bundleIdPrefix: com.muharafiq
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
targets:
  Stage:
    type: application
    platform: macOS
    sources:
      - path: StageApp
        excludes:
          - Info.plist
          - Stage.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.muharafiq.stage
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: StageApp/Info.plist
        CODE_SIGN_ENTITLEMENTS: StageApp/Stage.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_TESTABILITY: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
    scheme:
      testTargets:
        - StageTests
  StageTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - StageTests
    dependencies:
      - target: Stage
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.muharafiq.stage.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Stage.app/Contents/MacOS/Stage"
        BUNDLE_LOADER: "$(TEST_HOST)"
